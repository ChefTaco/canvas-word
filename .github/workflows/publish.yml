name: Publish to npm

# Publishes one package with provenance when its version is not on npm yet.
# - Push a tag engine-vX.Y.Z or codec-vX.Y.Z (matching that package's package.json) to publish it.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run of either package.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC). No npm token is stored in this repository.

on:
  push:
    tags: ['engine-v*', 'codec-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to pack and validate
        type: choice
        options: [engine, codec]
        default: engine
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read # read environment protection before any publication
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require protected publication environment
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publish-environment.mjs

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      - name: Gates
        run: |
          npm audit --omit=dev --audit-level=high
          npm run verify

      - name: Publish
        run: node scripts/publish-package.mjs
